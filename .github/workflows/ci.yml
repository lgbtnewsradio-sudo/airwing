name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Crypto + AirPlay tests under Electron runtime (BoringSSL)
        run: node_modules/electron/dist/electron.exe node_modules/vitest/vitest.mjs run tests/unit/crypto.test.ts tests/unit/chacha.test.ts tests/unit/airplay.test.ts
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: 1
      - run: npm run build
      - name: End-to-end (real capture + encode on the runner)
        run: npx playwright test
        continue-on-error: true
      - name: Package installer
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AirWing-windows
          path: |
            release/*.exe
            release/*.zip
