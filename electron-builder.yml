appId: dev.airwing.app
productName: AirWing
copyright: Copyright © 2026 AirWing contributors
directories:
  output: release
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.png
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  # Adds/removes the inbound Windows Firewall rule receivers need to fetch the stream.
  include: build/installer.nsh
  oneClick: false
  # Installs for all users and elevates. Required for the firewall rule in installer.nsh:
  # receivers fetch the live stream from this PC, and adding an inbound rule needs admin.
  # A per-user (unelevated) install cannot create it, which left casting broken.
  perMachine: true
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AirWing
  deleteAppDataOnUninstall: false
  # Enterprise deployment: AirWing-<ver>-win-x64.exe /S /D=C:\Path  (silent install)
publish: null
